<!DOCTYPE html>
<html>
<head>
  <title>Praise Jah Graphics</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .products {
      padding: 20px;
      display: grid;
      gap: 15px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ccc;
    }

    .product h2 {
      margin-top: 0;
    }

    .price {
      font-weight: bold;
      color: #e00000;
      font-size: 20px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #cart {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    #whatsapp {
      background: #25D366;
      width: 100%;
      font-size: 17px;
    }
  </style>
</head>

<body>

<header>
  <h1>Praise Jah Graphics</h1>
  <p>We Design • We Print • We Brand</p>
</header>

<section class="products">

  <div class="product">
    <h2>Graphics Design</h2>
    <p class="price">₦3,000</p>
    <button onclick="addToCart('Graphics Design', 3000)">
      Add to Cart
    </button>
  </div>

  <div class="product">
    <h2>Logo Design</h2>
    <p class="price">₦2,000</p>
    <button onclick="addToCart('Logo Design', 2000)">
      Add to Cart
    </button>
  </div>

  <div class="product">
    <h2>Poster</h2>
    <p class="price">₦800 each</p>
    <button onclick="addToCart('Poster', 800)">
      Add to Cart
    </button>
  </div>

  <div class="product">
    <h2>T-Shirt</h2>
    <p class="price">₦6,000 each</p>
    <button onclick="addToCart('T-Shirt', 6000)">
      Add to Cart
    </button>
  </div>

  <div class="product">
    <h2>Sticker</h2>
    <p class="price">50 pieces — ₦10,000</p>
    <button onclick="addToCart('Sticker (50 pieces)', 10000)">
      Add to Cart
    </button>
  </div>

</section>

<section id="cart">
  <h2>🛒 Your Cart</h2>

  <div id="cartItems">
    Your cart is empty.
  </div>

  <h3>Total: ₦<span id="total">0</span></h3>

  <button id="whatsapp" onclick="orderWhatsApp()">
    Order on WhatsApp
  </button>
</section>

<script>

let cart = [];
let total = 0;

function addToCart(name, price) {

  cart.push({
    name: name,
    price: price
  });

  total += price;

  showCart();
}

function showCart() {

  let cartItems = document.getElementById("cartItems");

  cartItems.innerHTML = "";

  cart.forEach(function(item, index) {

    cartItems.innerHTML +=
      "<p>" +
      item.name +
      " — ₦" +
      item.price.toLocaleString() +
      " <button onclick='removeItem(" +
      index +
      ")'>Remove</button></p>";

  });

  document.getElementById("total").innerText =
    total.toLocaleString();
}

function removeItem(index) {

  total -= cart[index].price;

  cart.splice(index, 1);

  showCart();
}

function orderWhatsApp() {

  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  let message = "Hello Praise Jah Graphics!%0A%0A";
  message += "I want to order:%0A";

  cart.forEach(function(item) {

    message +=
      "- " +
      item.name +
      " — ₦" +
      item.price.toLocaleString() +
      "%0A";

  });

  message +=
    "%0ATotal: ₦" +
    total.toLocaleString();

  let phone = "2349066506279";

  window.open(
    "https://wa.me/" + phone + "?text=" + message,
    "_blank"
  );
}

</script>

</body>
</html>
